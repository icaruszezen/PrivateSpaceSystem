services:
  privatespace:
    image: ghcr.io/icaruszezen/privatespacesystem:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: privatespace
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      VAULT_NAME: ${VAULT_NAME:-PrivateSpace}
      # 推荐留空：首次访问网页或手机端时在客户端本地执行零知识 E2EE v2 主密钥生成（服务器永不接触明文密码）。
      # 若设置 ADMIN_PASSWORD 用于自动化容器初始化，首启完成后请立即从宿主机环境变量/.env 中移除。
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-72}
      # 若置于 HTTPS 反向代理（Nginx / Caddy / Traefik）之后，建议设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - privatespace_data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  privatespace_data:
    driver: local
