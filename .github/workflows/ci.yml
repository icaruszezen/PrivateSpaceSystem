name: CI, Android APK, iOS & Docker Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/icaruszezen/privatespacesystem

jobs:
  verify:
    name: Typecheck, Crypto Tests & Container Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Web, Server, Android & iOS clients
        run: npm run typecheck

      - name: Run cryptographic, API, Android & iOS SDK tests
        run: npm test

      - name: Build production bundles (Web + /ios MPA + /mobile Android + Server)
        run: npm run build

      - name: Build & smoke-test Docker container
        run: |
          docker build -t privatespace-system:ci .
          docker run -d --name pss-ci \
            -p 18080:8080 \
            -e ADMIN_PASSWORD=CiTestMasterPass!2026 \
            privatespace-system:ci

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18080/api/v1/health | grep -q '"initialized":true'; then
              echo "Container healthcheck & bootstrap verified!"
              curl -sf http://127.0.0.1:18080/.well-known/apple-app-site-association | grep -q '"webcredentials"'
              curl -sf http://127.0.0.1:18080/ios | grep -q 'ios-root'
              curl -sf http://127.0.0.1:18080/mobile/ | grep -q 'PrivateSpace'
              TOKEN=$(curl -sf -X POST http://127.0.0.1:18080/api/v1/auth/login \
                -H 'Content-Type: application/json' \
                -d '{"password":"CiTestMasterPass!2026","platform":"android","deviceName":"CI Android"}' | node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync(0,'utf8')).token)")
              curl -sf -X POST http://127.0.0.1:18080/api/v1/notes \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer $TOKEN" \
                -d '{"title":"CI Smoke Test","content":"AES-256-GCM verified in container"}' | grep -q '"revision":1'
              curl -sf -X POST http://127.0.0.1:18080/api/v1/passwords \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer $TOKEN" \
                -d '{"title":"CI Vault Entry","username":"ops@example.com","password":"Str0ng#Vault!Password99","totpSecret":"JBSWY3DPEHPK3PXP"}' | grep -q '"revision":1'
              curl -sf "http://127.0.0.1:18080/api/v1/sync?since_seq=0" \
                -H "Authorization: Bearer $TOKEN" | grep -q '"passwords":\['
              echo "End-to-end encrypted notes, passwords, /mobile Android route, /ios app, AASA, and delta sync verified inside Docker container!"
              docker rm -f pss-ci
              exit 0
            fi
            sleep 1
          done

          docker logs pss-ci
          docker rm -f pss-ci
          exit 1

  android-apk:
    name: Build Android APK & Kotlin Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK (Platform 34)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          fi
          (yes || true) | "$SDKMANAGER" --licenses >/dev/null
          if [ ! -d "$SDK_ROOT/platforms/android-34" ] || [ ! -d "$SDK_ROOT/build-tools/34.0.0" ]; then
            "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android, run Kotlin JUnit tests & assemble Debug APK
        run: |
          npm run android:sync
          cd mobile/android && ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateSpace-Android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-verify:
    name: Native iOS SwiftKit XCTest & Xcode Simulator Build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 for live E2E backend
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install & build PrivateSpace backend
        run: |
          npm ci
          npm run build

      - name: Run SwiftPM PrivateSpaceKitTests against live PrivateSpace server
        run: |
          mkdir -p /tmp/pss-ios-ci-data
          PORT=18080 DATA_DIR=/tmp/pss-ios-ci-data node dist/server/server/index.js > /tmp/pss-ios-ci-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18080/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done

          PRIVATESPACE_TEST_SERVER_URL=http://127.0.0.1:18080 swift test --package-path ios

      - name: Generate Xcode project & build PrivateSpaceIOS + AutoFill Extension
        working-directory: ios
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          xcodegen generate
          xcodebuild \
            -project PrivateSpaceIOS.xcodeproj \
            -scheme PrivateSpaceIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  docker-publish:
    name: Multi-Arch Docker Build & Push (GHCR)
    needs: [verify, android-apk, ios-verify]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch support
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata and image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
