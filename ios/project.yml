name: PrivateSpaceIOS
options:
  bundleIdPrefix: io.privatespace
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release

packages:
  PrivateSpaceKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  PrivateSpaceIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: App/Info.plist
    entitlements:
      path: App/PrivateSpaceIOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.privatespace.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    dependencies:
      - package: PrivateSpaceKit
        product: PrivateSpaceKit
      - target: PrivateSpaceAutoFill
        embed: true

  PrivateSpaceAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AutoFillExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    info:
      path: AutoFillExtension/Info.plist
    entitlements:
      path: AutoFillExtension/PrivateSpaceAutoFill.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.privatespace.ios.autofill
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - package: PrivateSpaceKit
        product: PrivateSpaceKit

schemes:
  PrivateSpaceIOS:
    build:
      targets:
        PrivateSpaceIOS: all
        PrivateSpaceAutoFill: all
    run:
      config: Debug
    archive:
      config: Release
